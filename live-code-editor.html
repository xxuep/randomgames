<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Code Editor</title>
<style>
:root{color-scheme:dark;--bg:#0b1019;--panel:#111827;--edge:#263346;--muted:#93a4be;--accent:#67a8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#eaf1ff;overflow:hidden}
button,textarea{font:inherit}
.app{height:100dvh;display:flex;flex-direction:column}
header{height:58px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#111827;border-bottom:1px solid var(--edge);gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;letter-spacing:.1px;white-space:nowrap}
.mark{display:grid;place-items:center;width:30px;height:30px;background:#254c91;color:#a7d0ff;border-radius:9px;font-weight:900}
.actions{display:flex;align-items:center;gap:9px}
button{border:1px solid #32435a;background:#1c2a3f;color:#e7efff;border-radius:8px;padding:8px 12px;cursor:pointer;transition:background .15s}
button:hover{background:#2c3f5d}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.status{font-size:12px;color:#8bc6a9;white-space:nowrap}
.workspace{display:flex;min-height:0;flex:1}
.editor-pane{width:50%;min-width:260px;display:flex;flex-direction:column;background:#101722}
.pane-heading{height:44px;display:flex;align-items:center;justify-content:space-between;flex:none;padding:0 14px;border-bottom:1px solid var(--edge);color:#c4d0e4;font-weight:650;font-size:13px}
.tabs{display:flex;gap:5px;align-items:center;padding:8px 10px 0;border-bottom:1px solid var(--edge);background:#141c29}
.tab{border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;color:#a3b1c8;font-weight:650;min-width:78px;padding:10px 16px;position:relative}
.tab[aria-selected="true"]{color:#f8fbff;background:#202b3e;border-color:#33445c}
.tab[aria-selected="true"]:after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent)}
.editor-wrap{position:relative;min-height:0;flex:1}
.code{width:100%;height:100%;resize:none;border:0;outline:0!important;padding:20px 22px;background:#101722;color:#dce8fc;font:14px/1.65 "Cascadia Code",Consolas,"Courier New",monospace;tab-size:2;white-space:pre;overflow:auto}
.code[hidden]{display:none}
.footer{height:35px;flex:none;border-top:1px solid var(--edge);display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-size:11px;color:var(--muted)}
.splitter{width:7px;flex:none;cursor:col-resize;background:#243149;position:relative;touch-action:none}
.splitter:hover,.splitter.dragging{background:#498bea}
.splitter:after{content:"";position:absolute;top:50%;left:2px;width:3px;height:45px;transform:translateY(-50%);border-radius:5px;background:#70829d}
.preview-pane{flex:1;min-width:220px;display:flex;flex-direction:column;background:#fff}
.preview-heading{background:#151e2d}
.preview-heading .url{color:#94a8c5;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
iframe{flex:1;min-height:0;width:100%;border:0;background:white}
@media(max-width:650px){header{padding:0 9px}.brand span:last-child{display:none}.actions button{padding:7px 9px}.workspace{flex-direction:column}.editor-pane{width:100%!important;min-height:170px;height:50%;min-width:0}.preview-pane{min-width:0;min-height:120px}.splitter{width:100%;height:7px;cursor:row-resize}.splitter:after{height:3px;width:45px;left:50%;top:2px;transform:translateX(-50%)}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><span class="mark">&lt;/&gt;</span><span>Live Code Editor</span></div>
  <div class="actions"><span class="status" id="status" role="status">Live preview on</span><button id="reset" type="button">Reset</button><button id="download" type="button">Download HTML</button></div>
</header>
<main class="workspace" id="workspace">
  <section class="editor-pane" id="editorPane" aria-label="Code editor">
    <div class="pane-heading"><span>EDITOR</span><span id="activeFile">index.html</span></div>
    <div class="tabs" role="tablist" aria-label="Code files">
      <button class="tab" role="tab" aria-selected="true" aria-controls="html" data-tab="html" type="button">HTML</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="css" data-tab="css" type="button">CSS</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="js" data-tab="js" type="button">JS</button>
    </div>
    <div class="editor-wrap">
      <textarea class="code" id="html" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="HTML code"><div class="demo">
  <span class="tag">LIVE PREVIEW</span>
  <h1>Hello, world! 👋</h1>
  <p>Edit the HTML, CSS, or JavaScript on the left. Your changes appear here automatically.</p>
  <button id="demoButton">Click me</button>
  <p id="message"></p>
</div></textarea>
      <textarea class="code" id="css" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="CSS code" hidden>body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  font-family: system-ui, sans-serif;
  background: #eff5ff;
  color: #233149;
}
.demo {
  margin: 24px;
  padding: 38px;
  max-width: 500px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 18px 60px #4063a522;
}
.tag { color: #477ce0; font-size: 12px; font-weight: 800; letter-spacing: 2px; }
h1 { font-size: 36px; margin: 15px 0; }
p { color: #64748b; line-height: 1.7; }
button { border: 0; padding: 12px 20px; border-radius: 9px; background: #477ce0; color: white; font-weight: 700; cursor: pointer; }
button:hover { background: #2e60c2; }</textarea>
      <textarea class="code" id="js" spellcheck="false" autocomplete="off" autocapitalize="off" aria-label="JavaScript code" hidden>const button = document.getElementById('demoButton');
const message = document.getElementById('message');
button.addEventListener('click', () => {
  message.textContent = 'Your JavaScript works! 🎉';
});</textarea>
    </div>
    <div class="footer"><span>Changes update automatically</span><span>Tab key inserts spaces</span></div>
  </section>
  <div class="splitter" id="splitter" role="separator" aria-orientation="vertical" aria-label="Resize editor and preview" tabindex="0"></div>
  <section class="preview-pane" aria-label="Live website preview">
    <div class="pane-heading preview-heading"><span>PREVIEW</span><span class="url">Live output</span></div>
    <iframe id="preview" title="Live output" sandbox="allow-scripts allow-modals"></iframe>
  </section>
</main>
</div>
<script>
const editors = { html: document.getElementById('html'), css: document.getElementById('css'), js: document.getElementById('js') };
const preview = document.getElementById('preview');
const status = document.getElementById('status');
const defaults = Object.fromEntries(Object.entries(editors).map(([key, editor]) => [key, editor.value]));
const escapeScript = text => text.replace(/<\/script/gi, '<\\/script');
const escapeStyle = text => text.replace(/<\/style/gi, '<\\/style');
function compose() {
  const html = editors.html.value;
  const css = '<style>\n' + escapeStyle(editors.css.value) + '\n</style>';
  const js = '<script>\n' + escapeScript(editors.js.value) + '\n<\/script>';
  if (/<\/body\s*>/i.test(html)) return html.replace(/<\/body\s*>/i, css + '\n' + js + '\n</body>');
  return '<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">' + css + '</head><body>' + html + '\n' + js + '</body></html>';
}
let updateTimer;
function updatePreview() {
  clearTimeout(updateTimer);
  updateTimer = setTimeout(() => {
    preview.srcdoc = compose();
    status.textContent = 'Preview updated';
  }, 180);
}
for (const editor of Object.values(editors)) {
  editor.addEventListener('input', updatePreview);
  editor.addEventListener('keydown', event => {
    if (event.key !== 'Tab') return;
    event.preventDefault();
    const start = editor.selectionStart;
    editor.setRangeText('  ', start, editor.selectionEnd, 'end');
    updatePreview();
  });
}
const tabButtons = [...document.querySelectorAll('.tab')];
function activateTab(name) {
  tabButtons.forEach(button => button.setAttribute('aria-selected', String(button.dataset.tab === name)));
  Object.entries(editors).forEach(([key, editor]) => editor.hidden = key !== name);
  document.getElementById('activeFile').textContent = ({ html: 'index.html', css: 'style.css', js: 'script.js' })[name];
}
tabButtons.forEach(button => button.addEventListener('click', () => activateTab(button.dataset.tab)));
document.getElementById('reset').addEventListener('click', () => {
  if (!confirm('Reset all three editors to their starting code?')) return;
  Object.entries(editors).forEach(([key, editor]) => editor.value = defaults[key]);
  activateTab('html');
  updatePreview();
});
document.getElementById('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([compose()], { type: 'text/html;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'index.html';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
const splitter = document.getElementById('splitter');
const workspace = document.getElementById('workspace');
const editorPane = document.getElementById('editorPane');
let dragging = false;
function adjust(clientX, clientY) {
  const bounds = workspace.getBoundingClientRect();
  const vertical = window.matchMedia('(max-width:650px)').matches;
  const size = vertical ? bounds.height : bounds.width;
  const coordinate = vertical ? clientY - bounds.top : clientX - bounds.left;
  const min = vertical ? 170 : 260;
  const rightMin = vertical ? 120 : 220;
  const clamped = Math.min(Math.max(coordinate, min), size - rightMin - 7);
  if (vertical) { editorPane.style.height = clamped + 'px'; editorPane.style.width = '100%'; }
  else { editorPane.style.width = clamped + 'px'; editorPane.style.height = ''; }
}
splitter.addEventListener('pointerdown', event => {
  dragging = true;
  splitter.classList.add('dragging');
  splitter.setPointerCapture(event.pointerId);
  adjust(event.clientX, event.clientY);
});
splitter.addEventListener('pointermove', event => { if (dragging) adjust(event.clientX, event.clientY); });
function stopDragging() { dragging = false; splitter.classList.remove('dragging'); }
splitter.addEventListener('pointerup', stopDragging);
splitter.addEventListener('pointercancel', stopDragging);
splitter.addEventListener('keydown', event => {
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key)) return;
  event.preventDefault();
  const bounds = editorPane.getBoundingClientRect();
  const vertical = window.matchMedia('(max-width:650px)').matches;
  const delta = (event.key === 'ArrowRight' || event.key === 'ArrowDown') ? 20 : -20;
  adjust(bounds.left + (vertical ? 0 : bounds.width + delta), bounds.top + (vertical ? bounds.height + delta : 0));
});
updatePreview();
</script>
</body>
</html>
